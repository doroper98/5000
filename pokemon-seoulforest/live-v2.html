<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울숲 포켓몬 일정 실시간판</title><style>:root{--p:#6b43d9;--pl:#eee8ff;--line:#e4ddf7;--g:#eefaf4;--y:#fff6d8;--r:#fff1f1;--b:#eef6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#efe9ff,#fff 46%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#222;line-height:1.55}.wrap{max-width:920px;margin:0 auto;padding:14px 12px 50px}.hero,.box,.item,.plan{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px rgba(53,32,111,.10)}.hero{padding:20px;background:radial-gradient(circle at 10% 10%,#ded2ff,#fff 44%)}h1{font-size:24px;line-height:1.25;margin:0 0 8px}h2{font-size:21px;margin:24px 0 10px}.sub,.muted{color:#666}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(247,244,255,.92);backdrop-filter:blur(10px);padding:8px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 4px;font-weight:900;color:#4a28a2}.tab.on{background:var(--p);color:white}.page{display:none}.page.on{display:block}.box{padding:14px;margin:10px 0}.blue{background:var(--b)}.ok{background:var(--g)}.warn{background:var(--y)}.danger{background:var(--r)}.names{display:flex;gap:8px;flex-wrap:wrap}.names button{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 12px;font-weight:900}.names button.on{background:var(--p);color:white}.big{font-size:20px;font-weight:900;color:#33205d}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:stretch;padding:12px}.item.done{background:#f3fbf6;border-color:#a6d8bd}.meta{display:flex;gap:6px;flex-wrap:wrap}.time,.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-weight:900;font-size:13px}.time{background:var(--pl);color:#4a28a2}.badge{background:#f1f1f1;color:#555}.badge.done{background:#dff3e8;color:#1f6f47}.title{font-size:17px;font-weight:900;margin:5px 0}.do{font-size:14px;color:#444;margin:4px 0 0}.stamp{width:100%;min-height:82px;border:0;border-radius:16px;background:var(--p);color:#fff;font-weight:900;font-size:13px}.stamp.done{background:#2f8f5b}.stamp small{display:block;font-weight:700;margin-top:5px;opacity:.9}.plan{padding:14px;margin:10px 0}.row{display:grid;grid-template-columns:54px 1fr;gap:8px;border-top:1px dashed var(--line);padding:8px 0}.row:first-child{border-top:0}.row span{background:var(--pl);color:#4a28a2;border-radius:10px;text-align:center;font-size:12px;font-weight:900}.log{list-style:none;padding:0;margin:0}.log li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:14px;padding:12px;font-weight:900;background:var(--p);color:#fff}.btn.gray{background:#eee;color:#222}.btn.red{background:#c62828}@media(min-width:780px){.item{grid-template-columns:1fr 126px}.stamp{font-size:14px}}</style></head><body><main class="wrap"><section class="hero"><h1>세종 → 서울숲 포켓몬 실시간 일정판</h1><p class="sub">준우 엄마와 서진 엄마가 같은 링크에서 타임스탬프를 찍고 공유합니다.</p></section><nav class="tabs"><button class="tab on" data-tab="plan">오늘 일정</button><button class="tab" data-tab="live">실시간 진행</button><button class="tab" data-tab="log">기록·초기화</button></nav><section id="plan" class="page on"><h2>오늘 일정</h2><div id="planList"></div></section><section id="live" class="page"><h2>실시간 진행</h2><div class="box blue"><b>기록자 선택</b><p class="muted">타임스탬프 버튼을 누르면 선택한 이름으로 저장됩니다.</p><div class="names"><button data-name="준우 엄마">준우 엄마</button><button data-name="서진 엄마">서진 엄마</button></div></div><div class="box ok"><div class="muted">현재 기준</div><div class="big" id="nowStatus">불러오는 중</div><p class="muted" id="shiftStatus"></p></div><h2>해야 할 일 + 타임스탬프</h2><p class="muted">각 일정 오른쪽 버튼을 누릅니다. 목록은 사라지지 않아서 화면이 위아래로 흔들리지 않습니다.</p><div id="taskList" class="list"></div></section><section id="log" class="page"><h2>기록·초기화</h2><div class="box warn"><b>공유 링크</b><p id="shareText" class="muted"></p><div class="btns"><button class="btn" id="copyLink">링크 복사</button><button class="btn gray" id="reloadState">새로고침</button></div></div><h2>기록</h2><ul id="logList" class="log"></ul><div class="box danger"><b>테스트 후 초기화</b><p>초기화하면 이 trip의 스탬프 기록이 삭제됩니다.</p><button class="btn red" id="resetBtn">기록 초기화</button></div></section></main><script>const tripId=new URLSearchParams(location.search).get('trip')||'sejong-pokemon-0527-a8f3k9q2';const steps=[['arrive_terminal','세종 터미널 도착','07:55','08:10','화장실, 물, 간식, 보조배터리 확인'],['bus_start','세종 출발','08:25','10:54','08:25 버스 탑승'],['seoul_arrive','서울고속버스터미널 하차','10:55','11:10','화장실 후 택시 호출'],['wait_register','양쪽 웨이팅 접수','11:10','11:45','메타몽 QR과 시크릿 포레스트 태블릿 대기 접수'],['meet_forest','서울숲 합류','11:45','12:10','서울숲 방문자센터 또는 은행나무길 입구 합류'],['secret_forest','시크릿 포레스트 관람','12:10','13:40','포토존, 게임센터, 스토어, 인생네컷'],['lunch','점심 또는 간식','13:40','14:20','서울숲 근처에서 빠르게 식사'],['forest_extra','서울숲 보조 코스','14:20','15:00','나비정원, 곤충식물원, 사슴방사장 중 하나'],['move_ditto','메타몽 놀이터 이동','15:00','15:20','택시로 성수이로7가길 9 이동'],['ditto_playground','메타몽 놀이터 집중','15:20','16:40','외부 포토존, 내부 입장, 인생네컷, MD 구매, 카페'],['rest_seongsu','성수 주변 휴식','16:40','17:20','카페, 디저트, 화장실'],['move_terminal','강남고속버스터미널 이동','17:20','18:00','카카오T 목적지는 서울고속버스터미널 경부선'],['return_bus','세종 복귀 시작','18:00',null,'18시대 버스 탑승']].map(x=>({id:x[0],label:x[1],base:x[2],end:x[3],do:x[4]}));let state={stamps:[],resets:[]};function min(t){let[a,b]=t.split(':').map(Number);return a*60+b}function fmt(m){m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function kr(iso){return new Date(iso).toLocaleString('ko-KR',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function who(){return localStorage.getItem('stampedBy')||'준우 엄마'}function smap(){let m={};for(const s of state.stamps)m[s.step_id]=s;return m}function shift(){let m=smap(),last=null;for(const st of steps)if(m[st.id])last=st;if(!last)return 0;let d=new Date(m[last.id].stamped_at);return d.getHours()*60+d.getMinutes()-min(last.base)}function tr(st,sh){return fmt(min(st.base)+sh)+(st.end?'~'+fmt(min(st.end)+sh):' 이후')}function planCard(st,sh){return `<article class="plan"><div class="time">${tr(st,sh)}</div><div class="title">${st.label}</div><div class="row"><span>실행</span><p>${st.do}</p></div></article>`}function item(st,sh,s){return `<article class="item ${s?'done':''}"><div><div class="meta"><span class="time">${tr(st,sh)}</span><span class="badge ${s?'done':''}">${s?'완료':'대기'}</span></div><div class="title">${st.label}</div><p class="do">${st.do}</p>${s?`<p class="do"><b>실제:</b> ${kr(s.stamped_at)} · ${s.stamped_by}</p>`:''}</div><button class="stamp ${s?'done':''}" onclick="stamp('${st.id}','${st.label}')">${s?'다시 찍기':'타임스탬프'}<small>${who()}</small></button></article>`}function render(){let sh=shift(),m=smap(),next=steps.find(st=>!m[st.id]);document.getElementById('planList').innerHTML=steps.map(st=>planCard(st,0)).join('');document.getElementById('taskList').innerHTML=steps.map(st=>item(st,sh,m[st.id])).join('');document.getElementById('nowStatus').textContent=next?'다음: '+next.label:'모든 주요 단계 완료';document.getElementById('shiftStatus').textContent=sh===0?'예상 시간 기준입니다.':sh>0?'예상보다 약 '+sh+'분 늦습니다.':'예상보다 약 '+Math.abs(sh)+'분 빠릅니다.';document.getElementById('logList').innerHTML=state.stamps.length?state.stamps.slice().reverse().map(s=>`<li><b>${s.step_label}</b><br>${kr(s.stamped_at)} · ${s.stamped_by}</li>`).join(''):'<li>아직 기록이 없습니다.</li>';document.getElementById('shareText').textContent=location.origin+location.pathname+'?trip='+tripId;document.querySelectorAll('[data-name]').forEach(b=>b.classList.toggle('on',b.dataset.name===who()))}async function load(){try{let r=await fetch('/api/state?trip='+encodeURIComponent(tripId));state=await r.json();if(!state.stamps)state={stamps:[],resets:[]};render()}catch(e){document.getElementById('nowStatus').textContent='API 연결 실패';document.getElementById('shiftStatus').textContent='D1 바인딩 DB를 확인하세요.'}}async function stamp(id,label){await fetch('/api/stamp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tripId,stepId:id,stepLabel:label,stampedAt:new Date().toISOString(),stampedBy:who()})});await load()}async function resetTrip(){if(!confirm('오늘 기록을 초기화할까요?'))return;let v=prompt('정말 초기화하려면 아래 문구를 그대로 입력하세요.\n\n초기화합니다');if(v!=='초기화합니다')return alert('취소했습니다.');await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tripId,resetBy:who(),confirmText:'초기화합니다'})});await load();alert('초기화했습니다.')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{localStorage.setItem('stampedBy',b.dataset.name);render()});document.getElementById('copyLink').onclick=async()=>{await navigator.clipboard.writeText(location.origin+location.pathname+'?trip='+tripId);alert('복사했습니다.')};document.getElementById('reloadState').onclick=load;document.getElementById('resetBtn').onclick=resetTrip;load();setInterval(load,5000);</script></body></html>
